name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  qualidade:
    name: Formatação, lint, tipos, testes, build e contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build
      # Regenera o openapi.json e os tipos do web; falha se o que foi commitado estiver desatualizado
      - run: pnpm contract:check

  integracao:
    name: Integração com Postgres real
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api generate
      # O Testcontainers usa o Docker do próprio runner
      - run: pnpm test:integration

  docker:
    name: Ambiente Docker do zero e E2E
    needs: qualidade
    runs-on: ubuntu-latest
    # Alvo: o job todo em menos de 15 min; o teto cobre um build das imagens sem cache
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Dependências e Playwright antes do build das imagens: um lockfile quebrado falha em segundos.
      # O E2E roda no mesmo job, com o ambiente de pé, para as imagens serem construídas uma vez só.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      - name: Instalar o Chromium e as dependências do sistema
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Instalar só as dependências do sistema (Chromium em cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - name: Subir db, migrations, api, web, worker e ext-mock
        run: docker compose up --build --detach --wait --wait-timeout 600
      - name: Worker e ext-mock saudáveis
        run: |
          for servico in worker ext-mock; do
            estado=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$servico")")
            echo "$servico: $estado"
            test "$estado" = healthy
          done
          curl --fail --silent --show-error http://127.0.0.1:4010/health
      - name: API pronta e com banco
        run: curl --fail --silent --show-error http://127.0.0.1:3001/health/ready
      - name: Login na API com um usuário de demonstração
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --header 'Content-Type: application/json' \
            --data '{"email":"carla.mendes@demo.test","senha":"Demo@2026"}' \
            http://127.0.0.1:3001/api/v1/auth/login
      - name: Web mostra o login e protege a área logada
        run: |
          pagina=$(curl --fail --silent --show-error http://localhost:3000/login)
          echo "$pagina" | grep -q 'Entrar'
          resposta=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            http://localhost:3000/dashboard)
          echo "/dashboard sem sessão: $resposta"
          case "$resposta" in
            30[1278]\ */login*) ;;
            *) echo "Esperado redirecionamento para /login"; exit 1 ;;
          esac
      - name: Jornadas E2E (Playwright)
        run: pnpm test:e2e
        env:
          CI: true
      - name: Relatório e traces do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs dos containers
        if: failure()
        run: docker compose logs
      - name: Derrubar o ambiente
        if: always()
        run: docker compose down --volumes

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

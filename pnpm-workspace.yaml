packages:
  - apps/*

# Dependências autorizadas a executar scripts de instalação
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Scripts recusados de propósito: telemetria do swagger-ui, build nativo opcional do watch do Jest
# e builds nativos opcionais do cliente Docker usado pelo Testcontainers
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - cpu-features
  - protobufjs
  - ssh2
